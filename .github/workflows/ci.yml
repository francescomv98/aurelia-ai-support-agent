name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aurelia
          POSTGRES_USER: aurelia
          POSTGRES_PASSWORD: aurelia_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurelia -d aurelia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://aurelia:aurelia_dev_password@localhost:5432/aurelia
      AURELIA_DEMO_PASSWORD: AureliaDemo123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize database
        run: python -m scripts.init_database

      - name: Seed database
        run: python -m scripts.seed_database

      - name: Start MCP server
        run: |
          nohup python -m src.mcp.server > mcp-server.log 2>&1 &
          echo $! > mcp-server.pid

      - name: Wait for MCP server
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:8001/mcp"

          for attempt in range(30):
              try:
                  request = urllib.request.Request(url, headers={"Accept": "application/json, text/event-stream"})
                  with urllib.request.urlopen(request, timeout=2):
                      pass
              except Exception:
                  time.sleep(1)
              else:
                  print("MCP server is reachable")
                  break
          else:
              print("MCP server did not become reachable")
              with open("mcp-server.log", encoding="utf-8") as log:
                  print(log.read())
              raise SystemExit(1)

      - name: Run unit tests
        run: pytest tests/unit -v