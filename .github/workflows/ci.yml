name: CI

# Pushes to main, develop and version tags run this workflow through cd.yml,
# so each of those pushes is tested exactly once before its image is published.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - "release/**"
      - "hotfix/**"
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new commit on the same PR or branch makes the older run obsolete.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements.txt)"

      - name: Run ruff
        run: ruff check --output-format=github .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1  # audit tool only, not a project dependency

      # Fails when a pinned runtime dependency has a known vulnerability.
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: aurelia
          POSTGRES_USER: aurelia
          POSTGRES_PASSWORD: aurelia_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurelia -d aurelia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://aurelia:aurelia_dev_password@localhost:5432/aurelia
      AURELIA_DEMO_PASSWORD: AureliaDemo123!
      # Test-only signing key for the CI run (at least 32 bytes for HS256).
      # It signs nothing outside this job; never reuse it in a real deployment.
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production-use

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python -m scripts.init_database

      - name: Seed database
        run: python -m scripts.seed_database

      - name: Start MCP server
        run: |
          nohup python -m src.mcp.server > mcp-server.log 2>&1 &
          echo $! > mcp-server.pid

      - name: Wait for MCP server
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://localhost:8001/mcp"

          for attempt in range(30):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json, text/event-stream"},
                  )

                  with urllib.request.urlopen(request, timeout=2):
                      pass

              except urllib.error.HTTPError as exc:
                  # HTTP 400/405 can indicate that the MCP endpoint
                  # is responding but the request is not a valid MCP operation.
                  if exc.code in (400, 405):
                      print("MCP server is reachable")
                      break

                  time.sleep(1)

              except Exception:
                  time.sleep(1)

              else:
                  print("MCP server is reachable")
                  break
          else:
              print("MCP server did not become reachable")
              raise SystemExit(1)
          PY

      # Coverage accumulates across the three suites and is reported once at the end.
      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=

      - name: Run evaluation tests
        run: pytest tests/evaluation -v --cov=src --cov-append --cov-report=

      # Integration tests write to the seeded database and call the MCP server,
      # so they run after the unit tests against the same services.
      - name: Run integration tests
        run: pytest tests/integration -v --cov=src --cov-append --cov-report=

      - name: Coverage report
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml
          coverage report --fail-under=80

      - name: Show MCP server log
        if: failure()
        run: cat mcp-server.log || true

      - name: Upload coverage and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            mcp-server.log
          if-no-files-found: ignore
          retention-days: 14

  build-docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aurelia-ai-support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts and serves HTTP. /health needs no database or OpenAI,
      # so placeholder values are enough for the settings read at import time.
      - name: Smoke-test the image
        run: |
          docker run -d --name aurelia-api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder \
            -e JWT_SECRET_KEY=ci-only-jwt-secret-key-not-for-production-use \
            -e OPENAI_API_KEY=placeholder \
            aurelia-ai-support-agent:ci

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health; then
              echo
              echo "Image is healthy"
              exit 0
            fi
            sleep 1
          done

          echo "Image did not become healthy"
          docker logs aurelia-api
          exit 1
