name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: aurelia
          POSTGRES_USER: aurelia
          POSTGRES_PASSWORD: aurelia_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurelia -d aurelia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://aurelia:aurelia_dev_password@localhost:5432/aurelia
      AURELIA_DEMO_PASSWORD: AureliaDemo123!
      # Test-only signing key for the CI run (at least 32 bytes for HS256).
      # It signs nothing outside this job; never reuse it in a real deployment.
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production-use

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Initialize database
        run: python -m scripts.init_database

      - name: Seed database
        run: python -m scripts.seed_database

      - name: Start MCP server
        run: |
          nohup python -m src.mcp.server > mcp-server.log 2>&1 &
          echo $! > mcp-server.pid

      - name: Wait for MCP server
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://localhost:8001/mcp"

          for attempt in range(30):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json, text/event-stream"},
                  )

                  with urllib.request.urlopen(request, timeout=2):
                      pass

              except urllib.error.HTTPError as exc:
                  # HTTP 400/405 can indicate that the MCP endpoint
                  # is responding but the request is not a valid MCP operation.
                  if exc.code in (400, 405):
                      print("MCP server is reachable")
                      break

                  time.sleep(1)

              except Exception:
                  time.sleep(1)

              else:
                  print("MCP server is reachable")
                  break
          else:
              print("MCP server did not become reachable")
              try:
                  with open("mcp-server.log", encoding="utf-8") as log:
                      print(log.read())
              except OSError as exc:
                  print(f"Unable to read MCP server log: {exc}")

              raise SystemExit(1)
          PY

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run evaluation tests
        run: pytest tests/evaluation -v

      # Integration tests write to the seeded database and call the MCP server,
      # so they run after the unit tests against the same services.
      - name: Run integration tests
        run: pytest tests/integration -v

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t aurelia-ai-support-agent:${{ github.sha }} .